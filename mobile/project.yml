name: OnRoadBooksMobile
options:
  bundleIdPrefix: com.onroadbooks
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CODE_SIGN_STYLE: Automatic
targets:
  OnRoadBooks:
    type: application
    platform: iOS
    # DEVELOPMENT_TEAM vive aqui, no en el .xcodeproj: el proyecto se
    # regenera con `xcodegen generate` y se llevaria la firma por delante.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - Sources/OnRoadBooks
      - path: Resources
        buildPhase: resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: OnRoad Books
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        # Solo HTTPS estandar del sistema: exenta. Sin esto, App Store
        # Connect pregunta por cumplimiento de exportacion en cada build.
        ITSAppUsesNonExemptEncryption: false
        # The camera is only ever opened from "Adjuntar recibo"; the photo
        # library uses PHPicker, which needs no permission string at all.
        NSCameraUsageDescription: Para tomar la foto del recibo y adjuntarla al gasto.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mystodev.onroadbooks
        PRODUCT_NAME: OnRoad Books
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  OnRoadBooks:
    build:
      targets:
        OnRoadBooks: all
    run:
      config: Debug
    archive:
      config: Release
