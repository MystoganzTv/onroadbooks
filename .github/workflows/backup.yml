name: Nightly backup

# The ledger backed up somewhere that is not a laptop.
#
# `scripts/backup-database.ts` is the same script that runs on the owner's Mac,
# so there is one backup format and one implementation: dump, encrypt with
# AES-256-GCM, then decrypt it again and read it back with pg_restore, failing
# the run unless all 17 application tables are present.
#
# This lives in Actions only because the repository is PRIVATE. Artifacts of a
# public repository are world-readable, and an encrypted ledger sitting on the
# open internet is not a backup strategy — it is a countdown. If this repo is
# ever made public again, delete this workflow in the same commit.
on:
  schedule:
    # 08:10 UTC, a few minutes after the monthly-costs cron so a backup taken
    # on the 1st already contains that day's posted fixed costs.
    - cron: "10 8 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, encrypt and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      # Anywhere outside the checkout; the script refuses to write inside it.
      BACKUP_DIR: ${{ runner.temp }}/onroadbooks-backups
      AUTH_SECRET: unused-by-this-script
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The runner ships PostgreSQL 16 client tools; the script requires 17,
      # because a client older than the server refuses the dump outright.
      - name: PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb |deb [signed-by=/usr/share/keyrings/pgdg.gpg] |' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"

      - name: Install
        run: npm ci

      - name: Back up and verify
        run: npm run backup

      - name: Keep it
        uses: actions/upload-artifact@v4
        with:
          name: ledger-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/onroadbooks-backups/*.dump.enc
          retention-days: 90
          if-no-files-found: error
