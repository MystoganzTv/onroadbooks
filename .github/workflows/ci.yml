name: CI

# Runs on every push to main and every pull request. It is the part of the
# suite that can break on any change:
#
#   verify   types, lint and the money maths                   (~1.5 min)
#   browser  the whole app in Chromium, against a production    (~3 min)
#            build of this commit -- the build is the one Vercel
#            would run, so it is not repeated as its own step
#
# The two database suites (Prisma/Postgres and Neon/Drizzle/R2) live in
# database.yml: they run when database, auth or storage code changes, on pull
# requests, and nightly. See docs/operations.md.
#
# Trimmed without costing safety:
#   - main and pull requests only; a work branch no longer runs twice.
#   - Swift, docs and Markdown-only commits start no job here.
#   - a newer push to the same branch cancels the run it replaces.
#   - Chromium is cached against package-lock.json.
on:
  push:
    branches: [main]
    paths-ignore:
      - "mobile/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "mobile/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Types, lint and the money maths
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # CI never talks to Postgres here: the JSON store is the reference
      # implementation and the one the behavioural tests exercise.
      DATA_SOURCE: json
      DOCUMENT_STORAGE: local
      # A fixed key so the run does not write a session secret into the
      # workspace. It signs nothing that outlives the job.
      AUTH_SECRET: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the postinstall hook, which regenerates the Prisma
      # client into src/generated -- that directory is not in the repo.
      - name: Install
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  browser:
    name: The app in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATA_SOURCE: json
      DOCUMENT_STORAGE: local
      AUTH_SECRET: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Downloading Chromium every run is about a minute of billed time for a
      # binary that changes only when the Playwright version does.
      - name: Cache browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The cache holds the browser binary, not the OS libraries it links
      # against, so those are installed every run regardless of a cache hit.
      - name: Browser system libraries
        run: npx playwright install-deps chromium

      - name: Install browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install chromium

      # One production build serves the whole suite. A cold `next dev`
      # compiled every page on its first visit, which was most of the time.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:4173

      - name: Browser tests
        run: npm run test:e2e
        env:
          E2E_PRODUCTION_SERVER: "1"
