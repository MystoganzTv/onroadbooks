name: CI

# The repository is public, so Actions minutes are unlimited and nothing here
# is shaped by a bill. What stays are the changes that cost no safety:
#
#   - main and pull requests only. Pushing a work branch used to run the whole
#     suite twice, once for the push and again for the PR.
#   - nothing here tests Swift, Markdown or ADRs, so a commit touching only
#     those starts no job at all. That is waste and noise, not thrift.
#   - Chromium is cached against package-lock.json, because downloading the
#     same binary every run is a minute of nothing.
#
# Every gate runs on every push again: types, lint, the money maths, the
# browser suite and the real-Postgres suite. When minutes were metered those
# last two were cut back to nightly; free minutes buy that safety back, and
# safety is what they were.
on:
  push:
    branches: [main]
    paths-ignore:
      - "mobile/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "mobile/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Types, lint and the money maths
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # CI never talks to Postgres here: the JSON store is the reference
      # implementation and the one the behavioural tests exercise.
      DATA_SOURCE: json
      DOCUMENT_STORAGE: local
      # A fixed key so the run does not write a session secret into the
      # workspace. It signs nothing that outlives the job.
      AUTH_SECRET: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the postinstall hook, which regenerates the Prisma
      # client into src/generated -- that directory is not in the repo.
      - name: Install
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  browser:
    name: The app in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATA_SOURCE: json
      DOCUMENT_STORAGE: local
      AUTH_SECRET: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Downloading Chromium every run is about a minute of billed time for a
      # binary that changes only when the Playwright version does.
      - name: Cache browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The cache holds the browser binary, not the OS libraries it links
      # against, so those are installed every run regardless of a cache hit.
      - name: Browser system libraries
        run: npx playwright install-deps chromium

      - name: Install browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  postgres:
    name: The Postgres store, against a real database
    # The suite in `verify` proves the arithmetic against the JSON store, and
    # `store-contract` only compares the two stores' method NAMES. Everything
    # the Prisma store does differently -- foreign keys, transactions,
    # generated ids, the snapshot JSON column -- is only ever exercised here.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: onroad_books
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATA_SOURCE: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/onroad_books?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/onroad_books?schema=public
      DOCUMENT_STORAGE: local
      AUTH_SECRET: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply versioned migrations
        run: npm run db:migrate:deploy

      - name: Harden database access
        run: npm run db:harden

      - name: Verify migrations match the Prisma schema
        run: npm run db:migrate:verify

      - name: Seed the demo dataset
        run: npm run db:seed

      - name: Smoke check the store
        run: npm run smoke:postgres
