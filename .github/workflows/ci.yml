name: CI

# Every push and every pull request has to survive the same four gates the
# app is developed against: it compiles, it type-checks, it lints clean, and
# the money maths still holds.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, types, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # CI never talks to Postgres: the JSON store is the reference
      # implementation and the one the behavioural tests exercise.
      DATA_SOURCE: json
      DOCUMENT_STORAGE: local
      # A fixed key so the build does not write a session secret into the
      # workspace. It signs nothing that outlives the job.
      AUTH_SECRET: ci-only-not-a-real-secret
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the postinstall hook, which regenerates the Prisma
      # client into src/generated -- that directory is not in the repo.
      - name: Install
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  postgres:
    name: The Postgres store, against a real database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The suite above proves the arithmetic against the JSON store, and
    # `store-contract` only compares the two stores' method NAMES. Everything
    # the Prisma store does differently -- foreign keys, transactions,
    # generated ids, the snapshot JSON column -- is only ever exercised here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: onroad_books
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATA_SOURCE: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/onroad_books?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/onroad_books?schema=public
      DOCUMENT_STORAGE: local
      AUTH_SECRET: ci-only-not-a-real-secret
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Create the schema
        run: npx prisma db push --skip-generate

      - name: Seed the demo dataset
        run: npm run db:seed

      - name: Smoke check the store
        run: npm run smoke:postgres
